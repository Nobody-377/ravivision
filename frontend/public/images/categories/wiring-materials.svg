<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    
    <!-- Copper Metallic Gradient -->
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="75%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Red Insulation Wire -->
    <linearGradient id="redWire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <!-- Blue Insulation Wire -->
    <linearGradient id="blueWire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Yellow Insulation Wire -->
    <linearGradient id="yellowWire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Switch Plate Metallic Body -->
    <linearGradient id="plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    
    <!-- Soft Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>
  
  <!-- Ground Floor Shadow -->
  <ellipse cx="250" cy="420" rx="190" ry="35" fill="#0f172a" opacity="0.15" filter="blur(10px)"/>

  <!-- Back Layer: Large Red Electrical Wire Roll (Coil) -->
  <g filter="url(#dropShadow)">
    <ellipse cx="210" cy="270" rx="140" ry="60" fill="none" stroke="url(#redWire)" stroke-width="26"/>
    <ellipse cx="210" cy="264" rx="140" ry="60" fill="none" stroke="#f87171" stroke-width="4" opacity="0.6"/>
    <ellipse cx="210" cy="270" rx="110" ry="46" fill="none" stroke="url(#redWire)" stroke-width="22"/>
    <ellipse cx="210" cy="270" rx="80" ry="32" fill="none" stroke="#991b1b" stroke-width="18"/>
    <!-- Cable Binding Strap -->
    <rect x="120" y="240" width="16" height="60" rx="4" fill="#1e293b"/>
    <rect x="280" y="240" width="16" height="60" rx="4" fill="#1e293b"/>
  </g>

  <!-- Middle Layer: Blue & Yellow Stranded Cables Swirling -->
  <g filter="url(#dropShadow)">
    <!-- Yellow Wire Coil -->
    <path d="M 140 230 C 180 150, 320 150, 360 230 C 400 310, 260 380, 180 340" fill="none" stroke="url(#yellowWire)" stroke-width="16" stroke-linecap="round"/>
    <!-- Blue Wire Coil -->
    <path d="M 120 270 C 160 190, 300 170, 380 250 C 430 310, 310 400, 220 370" fill="none" stroke="url(#blueWire)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Exposed Copper Conductors (Stripped Wire Tips) -->
  <g filter="url(#softShadow)">
    <!-- Tip 1 (Red Wire Tip) -->
    <path d="M 370 215 L 415 190" stroke="url(#redWire)" stroke-width="16" stroke-linecap="butt"/>
    <path d="M 413 191 L 445 173" stroke="url(#copper)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="445" cy="173" r="3" fill="#f97316"/>

    <!-- Tip 2 (Blue Wire Tip) -->
    <path d="M 385 240 L 435 225" stroke="url(#blueWire)" stroke-width="16" stroke-linecap="butt"/>
    <path d="M 433 226 L 465 216" stroke="url(#copper)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="465" cy="216" r="3" fill="#f97316"/>

    <!-- Tip 3 (Yellow Wire Tip) -->
    <path d="M 360 270 L 415 265" stroke="url(#yellowWire)" stroke-width="16" stroke-linecap="butt"/>
    <path d="M 413 265 L 448 262" stroke="url(#copper)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="448" cy="262" r="3" fill="#f97316"/>
  </g>

  <!-- Foreground: Modular Electrical Switch & Socket Board -->
  <g filter="url(#dropShadow)">
    <!-- Main Outer Switch Plate Container -->
    <rect x="130" y="310" width="220" height="110" rx="18" fill="url(#plate)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="136" y="316" width="208" height="98" rx="14" fill="#ffffff"/>
    
    <!-- 3-Pin Socket (Left Side) -->
    <g transform="translate(155, 332)">
      <rect x="0" y="0" width="66" height="66" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <!-- Top Earth Hole -->
      <circle cx="33" cy="20" r="6" fill="#1e293b"/>
      <!-- Live & Neutral Holes -->
      <circle cx="21" cy="42" r="4.5" fill="#1e293b"/>
      <circle cx="45" cy="42" r="4.5" fill="#1e293b"/>
    </g>

    <!-- Rocker Switch 1 (Middle) -->
    <g transform="translate(235, 332)">
      <rect x="0" y="0" width="44" height="66" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Switch Toggle Button -->
      <rect x="4" y="4" width="36" height="58" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <path d="M 8 10 L 36 10 L 36 34 L 8 30 Z" fill="#f8fafc"/>
      <!-- Red ON Indicator Dot -->
      <circle cx="22" cy="50" r="2.5" fill="#ef4444"/>
    </g>

    <!-- Rocker Switch 2 (Right) -->
    <g transform="translate(290, 332)">
      <rect x="0" y="0" width="44" height="66" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Switch Toggle Button -->
      <rect x="4" y="4" width="36" height="58" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <path d="M 8 10 L 36 10 L 36 34 L 8 30 Z" fill="#f8fafc"/>
      <!-- Red ON Indicator Dot -->
      <circle cx="22" cy="50" r="2.5" fill="#ef4444"/>
    </g>
  </g>

  <!-- Miniature Circuit Breaker (MCB) on the Right Corner -->
  <g filter="url(#softShadow)" transform="translate(365, 300)">
    <rect x="0" y="0" width="55" height="100" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="8" y="10" width="39" height="20" rx="4" fill="#1e293b"/>
    <text x="27" y="24" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#22c55e" text-anchor="middle">C32</text>
    <!-- MCB Toggle Switch -->
    <rect x="15" y="42" width="25" height="36" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="18" y="45" width="19" height="16" rx="3" fill="#dc2626"/>
    <text x="27" y="57" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#ffffff" text-anchor="middle">ON</text>
  </g>
</svg>
